name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Run tests from source
        run: ruby -Ilib test/static_literal_parser_test.rb
      - name: Build gem
        run: gem build static_literal_parser.gemspec
      - name: Install built gem
        run: gem install --local --install-dir "$RUNNER_TEMP/gem-home" static_literal_parser-*.gem
      - name: Run tests against installed gem
        env:
          GEM_HOME: ${{ runner.temp }}/gem-home
        run: ruby test/static_literal_parser_test.rb
